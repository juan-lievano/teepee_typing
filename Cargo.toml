[package]
name = "teepee_typing"
version = "0.1.0"
edition = "2024"
description = "Terminal typing trainer that records every keystroke to SQLite"
license = "MIT"
repository = "https://github.com/juan-lievano/teepee_typing"

[[bin]]
name = "teepee"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
rand = "0.10.3"
ratatui = "0.30.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
